<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Campbell's Crew Cares Portal</title>
    <style>:root{--ink:#111821;--green:#35d32f;--forest:#176b39;--mist:#edf3ed;--line:#cbd5ce}*{box-sizing:border-box}body{margin:0;background:var(--mist);font-family:Arial,sans-serif;color:var(--ink)}header{height:74px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff}header b{font-size:12px;letter-spacing:.12em;text-transform:uppercase}header a{color:var(--green);font-size:11px;font-weight:800;text-decoration:none;text-transform:uppercase}.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 74px)}aside{padding:30px 18px;background:var(--ink)}aside p,.eyebrow{color:var(--forest);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}aside p{color:var(--green);padding:0 10px}aside button{display:block;width:100%;padding:13px 10px;border:0;border-left:3px solid transparent;background:transparent;color:#fff;text-align:left;font-size:12px;font-weight:800;cursor:pointer}aside button:not(:disabled):hover{border-left-color:var(--green);background:#1d2a24}aside button:disabled{color:#7e8a84;cursor:not-allowed}section{padding:clamp(28px,5vw,68px);max-width:1400px}h1{margin:8px 0 12px;font-family:"Arial Black",Arial,sans-serif;font-size:clamp(42px,6vw,72px);line-height:.94;text-transform:uppercase}.records{display:grid;gap:9px;max-width:800px}.records article,.empty,form{padding:24px;background:#fff;border:1px solid var(--line)}.records article{display:grid;gap:5px;border-left:5px solid var(--green)}small,p{color:#59665f;line-height:1.5}.empty{max-width:620px}.empty h2,form h2{margin-top:0}form{display:grid;gap:14px;max-width:620px;margin-top:25px}label{display:grid;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase}input,select{min-height:46px;padding:10px;border:1px solid #9ba8a0;font:inherit}form button,.empty button{padding:14px;border:1px solid var(--green);background:var(--green);font-size:11px;font-weight:800;text-transform:uppercase;cursor:pointer}output{min-height:20px;color:#9b2f25}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{padding:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:3px}aside p{grid-column:1/-1;margin:0}section{padding:30px 20px}}</style>
  </head>
  <body><main id="app"><div class="eyebrow">Campbell's Crew Cares</div><h1>Loading…</h1></main><script src="/portal-assets/app.js" defer></script></body>
</html>
