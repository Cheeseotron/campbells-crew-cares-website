<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Campbell's Crew Cares Portal</title>
    <style>body{margin:0;font-family:Arial,sans-serif;background:#edf3ed;color:#111821}main{max-width:720px;margin:10vh auto;padding:36px;background:#fff;border-top:7px solid #35d32f;box-shadow:0 15px 45px #1118211c}p{line-height:1.6;color:#57635d}.eyebrow,label{color:#176b39;font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase}h1{font-size:clamp(38px,7vw,68px);line-height:.92;margin:16px 0;text-transform:uppercase}.closed,.notice{padding:16px;background:#fff5d8;border-left:4px solid #e0a31a;font-weight:700}.notice.success{background:#e9f8ea;border-color:#176b39}.form{display:grid;gap:15px;margin-top:28px}.form label{display:grid;gap:7px}.form input,.form select,.form textarea{font:inherit;padding:12px;border:1px solid #9ba8a0;background:#fff;min-height:46px}.form button{padding:14px;background:#35d32f;border:1px solid #35d32f;color:#111821;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.helper{font-size:14px}.hidden{display:none}</style>
  </head>
  <body><main id="app"><div class="eyebrow">Campbell's Crew Cares</div><h1>Loading…</h1></main><script>
    const app = document.querySelector('#app'); const path = location.pathname;
    const escape = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    async function load() {
      const response = await fetch('/portal-api/public/events'); const data = await response.json();
      const kind = path === '/apply' ? 'recipient application' : 'volunteer opportunity';
      if (data.mode !== 'open' || !data.events.length) { app.innerHTML = `<div class="eyebrow">Campbell's Crew Cares</div><h1>${kind} updates</h1><p>There are no open ${kind}s right now. Please check back soon.</p><p class="closed">This page is ready for the next event, but registration is currently closed.</p>`; return; }
      const events = data.events.filter(e => path !== '/apply' || e.event_type === 'shopping');
      if (!events.length) { app.innerHTML = `<div class="eyebrow">Campbell's Crew Cares</div><h1>Applications are closed</h1><p>There are no open shopping events accepting recipient applications right now.</p>`; return; }
      const choices = events.map(e => `<option value="${escape(e.id)}">${escape(e.title)}${e.event_date ? ' — ' + escape(e.event_date) : ''}</option>`).join('');
      if (path === '/apply') app.innerHTML = `<div class="eyebrow">Campbell's Crew Cares</div><h1>Apply for help</h1><p>Applications are reviewed by the Campbell's Crew team. Submitting does not guarantee acceptance.</p><div id="notice"></div><form class="form" id="application"><label>Event<select name="eventId">${choices}</select></label><label>Responsible party name<input required name="guardianName" autocomplete="name"></label><label>Email<input required name="email" type="email" autocomplete="email"></label><label>Phone<input required name="phone" type="tel" autocomplete="tel"></label><label>Child's first name<input required name="firstName"></label><label>Child's last name<input required name="lastName"></label><label>Notes or accommodations<textarea name="notes"></textarea></label><button>Submit application →</button></form>`;
      else app.innerHTML = `<div class="eyebrow">Campbell's Crew Cares</div><h1>Volunteer</h1><p>Choose an open event, then tell us how you would like to help.</p><div id="notice"></div><form class="form" id="volunteer"><label>Event<select name="eventId">${choices}</select></label><label>Your name<input required name="name" autocomplete="name"></label><label>Email<input required name="email" type="email" autocomplete="email"></label><label>Phone<input name="phone" type="tel" autocomplete="tel"></label><label>Volunteer role<input required name="role" placeholder="For example, Shopper"></label><label class="helper"><input name="alertOptIn" type="checkbox"> I would like future volunteer-event alerts.</label><button>Register to volunteer →</button></form>`;
      const form = document.querySelector('form'); form.addEventListener('submit', async event => { event.preventDefault(); const values = Object.fromEntries(new FormData(form)); const body = path === '/apply' ? {...values, children:[{firstName:values.firstName,lastName:values.lastName}]} : {...values, alertOptIn:form.alertOptIn.checked}; const result = await fetch(path === '/apply' ? '/portal-api/public/applications' : '/portal-api/public/volunteer-signups', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const reply = await result.json(); const notice=document.querySelector('#notice'); notice.className='notice' + (result.ok ? ' success' : ''); notice.textContent=reply.message || reply.error || 'Please try again.'; if(result.ok) form.reset(); });
    }
    load().catch(() => { app.innerHTML='<div class="eyebrow">Campbell\'s Crew Cares</div><h1>Please try again</h1><p>We could not load this page just now.</p>'; });
  </script></body>
</html>
